name: DPRO CHAT B R2 BAKERY Public Guide Safety

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "dpromstk2000-lab/bakery-line-system"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal R2 fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          
          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: expected source text not found")
              return text.replace(old, new)
          
          # owner.html: remove only user-visible STEP/release wording.
          owner = Path("owner.html")
          s = owner.read_text(encoding="utf-8")
          
          s = replace_required(
              s,
              "<title>DPROベーカリーLINE | owner.html STEP BAKERY-PHONE-2</title>",
              "<title>DPROベーカリーLINE｜オーナー管理</title>",
              "owner title"
          )
          s = replace_required(
              s,
              '<div class="badge">STEP BAKERY-PHONE-2 / 営業前DEMO・ステータス制約対応 owner.html</div>',
              '<div class="badge">オーナー管理 / 営業前デモ対応</div>',
              "owner visible badge"
          )
          s = replace_required(
              s,
              "DPROベーカリーLINE / owner.html STEP BAKERY-PHONE-2<br>",
              "DPROベーカリーLINE / オーナー管理<br>",
              "owner visible footer"
          )
          
          owner.write_text(s, encoding="utf-8")
          
          # guide.html: customer/operator-visible development labels only.
          guide = Path("guide.html")
          g = guide.read_text(encoding="utf-8")
          
          replacements = [
              (
                  '<div class="kicker">DPRO TUTORIAL / BAKERY GUIDE CENTER R4 / STANDARD V1.1</div>',
                  '<div class="kicker">DPRO ベーカリー LINE / 操作ガイド</div>'
              ),
              (
                  "既存29記事と12FAQを維持し、R3と同じ「最初の10分」から確認できます。",
                  "29記事と12FAQを維持し、「最初の10分」から確認できます。"
              ),
              (
                  '<small>FIRST 10 / SINGLE SOURCE</small>',
                  '<small>はじめに</small>'
              ),
              (
                  "R3 First10と同じ10件・同じ順番を、同じソースから表示します。",
                  "最初の10項目を、決められた順番で分かりやすく表示します。"
              ),
              (
                  '<div class="footer">DPRO SHOP / DPRO TUTORIAL BAKERY / Guide Center R4 V1.1 / 29 articles / 12 FAQ / business mutation 0</div>',
                  '<div class="footer">DPRO SHOP / DPRO ベーカリー LINE / 操作ガイド / 29記事 / 12FAQ</div>'
              ),
          ]
          for old, new in replacements:
              if old not in g:
                  raise SystemExit("guide.html: expected public copy not found: " + old[:80])
              g = g.replace(old, new)
          
          guide.write_text(g, encoding="utf-8")
          print("BAKERY R2 visible-copy patch: PASS")
          PY

      - name: Static safety QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          
          owner = Path("owner.html").read_text(encoding="utf-8")
          guide = Path("guide.html").read_text(encoding="utf-8")
          
          # User-visible owner labels must be clean.
          for forbidden in [
              "<title>DPROベーカリーLINE | owner.html STEP BAKERY-PHONE-2</title>",
              '<div class="badge">STEP BAKERY-PHONE-2 / 営業前DEMO・ステータス制約対応 owner.html</div>',
              "DPROベーカリーLINE / owner.html STEP BAKERY-PHONE-2<br>",
          ]:
              assert forbidden not in owner, forbidden
          
          for required in [
              "<title>DPROベーカリーLINE｜オーナー管理</title>",
              '<div class="badge">オーナー管理 / 営業前デモ対応</div>',
              "DPROベーカリーLINE / オーナー管理<br>",
          ]:
              assert required in owner, required
          
          # Guide Center visible labels must be customer/operator-readable.
          for forbidden in [
              "DPRO TUTORIAL / BAKERY GUIDE CENTER R4 / STANDARD V1.1",
              "FIRST 10 / SINGLE SOURCE",
              "R3 First10と同じ10件",
              "Guide Center R4 V1.1",
              "business mutation 0",
          ]:
              assert forbidden not in guide, forbidden
          
          for required in [
              "DPRO ベーカリー LINE / 操作ガイド",
              "最初の10分を再実行",
              "オーナー画面へ戻る",
              "29記事",
              "12FAQ",
          ]:
              assert required in guide, required
          
          # Important internal runtime asset hook is intentionally preserved.
          assert "dpro-tutorial-first10.js?v=R4-V1.1-20260828" in guide
          
          print("BAKERY R2 static safety QA: PASS")
          PY
          git diff --check

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "DPRO CHAT B R2"
          git config user.email "actions@users.noreply.github.com"
          git rm ".github/workflows/dpro-chat-b-r2-public-guide-safety.yml"
          git add owner.html guide.html
          git commit -m "DPRO CHAT B R2: clean BAKERY public guide labels"
          git push
