name: DPRO CHAT B BAKERY Owner Guide Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-chat-b-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "dpromstk2000-lab/bakery-line-system" ]; then
            echo "Wrong repository: expected dpromstk2000-lab/bakery-line-system, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add restrained owner guide entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("owner.html")
          if not p.exists():
              raise SystemExit("owner.html not found")

          guide = Path("guide.html")
          if not guide.exists():
              raise SystemExit("guide.html not found. BAKERY Guide Center source is required.")

          gs = guide.read_text(encoding="utf-8")

          required_guide_tokens = [
              'data-dpro-guide-center="1"',
              'href="./owner.html?tutorial=replay"',
              'href="./owner.html"',
              "オーナー画面へ戻る",
          ]
          for token in required_guide_tokens:
              if token not in gs:
                  raise SystemExit(f"guide.html role/replay requirement missing: {token}")

          s = p.read_text(encoding="utf-8")
          before = s

          s = s.replace('href="guide-center.html"', 'href="guide.html"')
          s = s.replace('href="guide-center.html?from=owner"', 'href="guide.html"')

          if "data-dpro-chat-b-guide" not in s:
              style = """
          <style id="dpro-chat-b-guide-style">
          .dpro-chat-b-guide-link{position:fixed;right:12px;bottom:12px;z-index:9999;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 13px;border:1px solid rgba(0,0,0,.12);border-radius:999px;background:#fff;color:#3b2518;text-decoration:none;font:800 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.12)}
          .dpro-chat-b-guide-link:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
          @media(max-width:700px){.dpro-chat-b-guide-link{bottom:72px;right:10px;min-height:40px;padding:7px 11px;font-size:12px}}
          </style>
          """
              link = """
          <a class="dpro-chat-b-guide-link" data-dpro-chat-b-guide href="guide.html" aria-label="操作ガイドを開く">操作ガイド</a>
          """
              if "</head>" not in s or "</body>" not in s:
                  raise SystemExit("safe HTML insertion markers missing")
              s = s.replace("</head>", style + "</head>", 1)
              s = s.replace("</body>", link + "</body>", 1)

          if s.count("data-dpro-chat-b-guide") != 1:
              raise SystemExit("guide entry count is not exactly 1")
          if 'href="guide.html"' not in s:
              raise SystemExit("BAKERY guide href missing")

          if s != before:
              p.write_text(s, encoding="utf-8")

          print("BAKERY OWNER GUIDE PATCH:", "CHANGED" if s != before else "ALREADY_OK")
          PY

      - name: Static guide QA
        shell: bash
        run: |
          grep -q 'data-dpro-chat-b-guide' owner.html
          grep -q 'href="guide.html"' owner.html
          grep -q 'data-dpro-guide-center="1"' guide.html
          grep -q 'href="./owner.html?tutorial=replay"' guide.html
          grep -q 'href="./owner.html"' guide.html
          grep -q 'オーナー画面へ戻る' guide.html
          echo 'BAKERY OWNER GUIDE static QA: PASS'

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-chat-b-guide-bakery.yml"
          git add "owner.html"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add CHAT B owner 操作ガイド entry for BAKERY"
          git push
